<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST CNN | Dayyan's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Notice relative paths to root css -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="font-bold text-lg">Dayyan's Lab</div>
            <div class="nav-links">
                <a href="../../index.html" class="nav-link">&larr; Back to Lab</a>
            </div>
        </div>
    </nav>

    <main class="container mt-12 mb-12 flex-col">
        <header class="mb-8 flex flex-col items-center text-center">
            <div class="flex justify-center items-center gap-4 mb-2">
                <h1 class="text-3xl">MNIST CNN</h1>
                <span class="tag">TensorFlow.js</span>
            </div>
            <p class="text-xl text-muted">Custom Convolutional Neural Network</p>
            <div class="mt-4 flex justify-center gap-4 text-sm text-muted font-mono">
                <span>98.6% Test Accuracy</span> &middot; <span>MNIST Dataset</span> &middot; <span>CV</span>
            </div>
        </header>

        <div class="flex flex-col gap-8" style="max-width: 700px; margin: 0 auto; width: 100%;">
            
            <!-- Interactive Demo -->
            <div>
                <section class="content-section">
                    <h2 style="border-bottom: none; margin-bottom: 0.5rem;">Demo</h2>
                    <p class="text-base text-muted mb-8" style="line-height: 1.6;">
                        Draw a digit (0-9) below to test the browser-based CNN.
                    </p>
                    
                    <div class="flex flex-col items-center gap-6">
                        <div class="canvas-wrapper" style="box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);">
                            <canvas id="canvas" width="280" height="280"></canvas>
                        </div>
                        
                        <button id="clear-btn" class="btn btn-secondary w-full" style="max-width: 280px;" onclick="clearCanvas()">Clear Canvas</button>
                        
                        <div class="flex items-center justify-center p-4 w-full" style="background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; max-width: 280px; min-height: 64px;">
                            <div id="output" class="font-mono text-xl text-accent font-bold text-center">Loading...</div>
                        </div>
                    </div>
                </section>
            </div>

            </div>
        </div>
    </main>

    <!-- TensorFlow.js Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
