<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST CNN | Dayyan's Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Notice relative paths to root css -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="font-bold text-lg">Dayyan's Lab</div>
            <div class="nav-links">
                <a href="../../index.html" class="nav-link">&larr; Back to Lab</a>
            </div>
        </div>
    </nav>

    <main class="container mt-12 mb-12 flex-col">
        <header class="mb-8 flex flex-col items-center text-center">
            <div class="flex justify-center items-center gap-4 mb-2">
                <h1 class="text-3xl">MNIST CNN</h1>
                <span class="tag">TensorFlow.js</span>
            </div>
            <p class="text-xl text-muted">Custom Convolutional Neural Network</p>
            <div class="mt-4 flex justify-center gap-4 text-sm text-muted font-mono">
                <span>98.6% Test Accuracy</span> &middot; <span>MNIST Dataset</span> &middot; <span>CV</span>
            </div>
        </header>

        <div class="flex flex-col gap-8" style="max-width: 700px; margin: 0 auto; width: 100%;">
            
            <!-- Interactive Demo -->
            <div>
                <section class="content-section" style="display: flex; flex-direction: column; align-items: center;">
                    <h2 style="width: 100%; text-align: center; border-bottom: none; margin-bottom: 1rem;">Demo</h2>
                    <p class="text-base text-muted mb-8 text-center" style="max-width: 400px; line-height: 1.6;">
                        Draw any single digit (0-9) in the box below.<br>
                        The CNN runs directly in your browser.
                    </p>
                    
                    <div class="canvas-wrapper">
                        <!-- 280x280 is 10x the 28x28 MNIST resolution -->
                        <canvas id="canvas" width="280" height="280"></canvas>
                    </div>

                    <div class="mt-6 w-full flex justify-center">
                        <button id="clear-btn" class="btn btn-secondary" onclick="clearCanvas()">Clear Canvas</button>
                    </div>

                    <div class="mt-6 p-4 w-full text-center" style="background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 6px;">
                        <div id="output" class="font-mono text-lg text-accent">Loading model...</div>
                    </div>
                </section>
            </div>

            </div>
        </div>
    </main>

    <!-- TensorFlow.js Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
